<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ravshan Baxranov — Apps</title>
<meta name="description" content="Android apps by Ravshan Baxranov.">
<style>
  :root { --bg: #F2F5F3; --tile: #FFFFFF; --text: #0F1A15; --muted: #5F6D66; --accent: #0B8A57; --border: #E3E9E5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #090C0B; --tile: #111714; --text: #E8EFEB; --muted: #8A9A92; --accent: #3DDC97; --border: #1A221E; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .muted { color: var(--muted); margin: 0 0 24px; }
  a.app {
    display: block; text-decoration: none; color: inherit; background: var(--tile);
    border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 8px;
  }
  a.app h2 { font-size: 17px; margin: 0 0 4px; color: var(--accent); }
  a.app p { margin: 0; color: var(--muted); font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1>Ravshan Baxranov</h1>
  <p class="muted">Android apps</p>
  <a class="app" href="adpulse/">
    <h2>AdPulse</h2>
    <p>Read-only AdMob earnings dashboard and widget.</p>
  </a>
</main>
</body>
</html>
